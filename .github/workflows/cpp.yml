name: cpp

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build ccache \
            libssl-dev libcurl4-openssl-dev libsqlite3-dev libncurses-dev

      - name: Configure
        run: >
          cmake -G Ninja -S cppcli -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j3

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Docs freshness (the page must match the tree)
        # node is preferred (check.mjs); the python fallback covers
        # images without node.
        run: node docs/check.mjs || python3 scripts/check_docs.py

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build ccache \
            libssl-dev libcurl4-openssl-dev libsqlite3-dev libncurses-dev

      - name: Configure (ASan + UBSan)
        run: >
          cmake -G Ninja -S cppcli -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DBUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -j3

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
