name: ARM32 (armv7) Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  armv7:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    name: Build matrixcli for armv7 (armhf)

    steps:
      - name: Install the ARM (armhf) cross toolchain
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-arm-linux-gnueabihf \
            libssl-dev:armhf \
            libsqlite3-dev:armhf \
            libcurl4-openssl-dev:armhf \
            libsodium-dev:armhf \
            libstdc++6:armhf \
            libgcc-s1:armhf \
            cmake make git ca-certificates python3 pkg-config file

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cross-compile (armv7, Release)
        run: |
          # Point pkg-config at the armhf .pc files only — the host
          # pkg-config otherwise can't see the cross libs (sqlite3/curl).
          export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig
          cmake -B build -S cppcli \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DBUILD_TUI=OFF \
            -DBUILD_TESTS=OFF \
            -DUSE_SYSTEM_OLM=OFF \
            -DPROGRESSIVE_CORE_USE_ARTIFACT=OFF
          cmake --build build -j$(nproc)

      - name: Verify the binary
        run: |
          file build/src/matrixcli
          test -x build/src/matrixcli

      - name: Smoke test under qemu
        run: |
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://github.com/multiarch/qemu-user-static/releases/latest/download/qemu-arm-static', 'qemu-arm-static')"
          chmod +x qemu-arm-static
          ./qemu-arm-static build/src/matrixcli about

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrixcli-armv7
          path: build/src/matrixcli

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp build/src/matrixcli "matrixcli-${{ github.ref_name }}-linux-armv7"
          gh release upload "${{ github.ref_name }}" \
            "matrixcli-${{ github.ref_name }}-linux-armv7" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
