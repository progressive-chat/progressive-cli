# Deploys the docs/ folder as the GitHub Pages site.
#
# NOTE: this workflow only uploads the docs/ directory as a Pages
# artifact. It never commits to any branch and never touches content
# outside docs/ — it cannot replace existing pages. It requires the
# repo setting: Settings > Pages > Source = "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'cppcli/src/**'
      - 'cppcli/lib/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate + verify the docs (fail when stale or broken)
        run: node docs/check.mjs --gen
      - name: Upload the docs as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
